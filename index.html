<style>
:root {

}
.field textarea { height: auto; min-height: 120px; padding: 12px; resize: vertical; }

  *, *::before, *::after { animation: none !important; transition: none !important; }

  async function sha256(text) {
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("te::" + text));
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    } catch (e) {
      let h = 2166136261;
      const s = "te::" + text;
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
      return "x" + (h >>> 0).toString(16) + s.length;
    }
  }

      write(base + "_guest", []);

    const ge = read("te_enq_guest", []);

    ctx: null,

    ensure() {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === "suspended") this.ctx.resume();
    },
    tone(freq, dur, type, gain) {
      if (this.muted) return;
      try {
        this.ensure();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = type || "sine";
        o.frequency.value = freq;
        g.gain.setValueAtTime(gain || 0.035, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + dur);
      } catch (e) {}
    },
    click() { this.tone(740, 0.06, "sine", 0.03); },
    add() { this.tone(520, 0.08, "triangle", 0.04); setTimeout(() => this.tone(780, 0.1, "triangle", 0.03), 70); },

  async function onAuth(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const email = String(fd.get("email") || "").trim().toLowerCase();
    const password = String(fd.get("password") || "");
    const mode = e.target.getAttribute("data-mode");
    if (!email || !password) return toast("Enter email and password");
    const list = users();
    if (mode === "signup") {
      const name = String(fd.get("name") || "").trim();
      const confirm = String(fd.get("confirm") || "");
      if (name.length < 2) return toast("Enter your name");
      if (password.length < 6) return toast("Use at least 6 characters");
      if (password !== confirm) return toast("Passwords do not match");
      if (list.some((u) => u.email === email)) return toast("That email already has an account on this device");
      const passHash = await sha256(password);
      const user = { id: uid("U"), name, email, passHash, avatar: "", since: new Date().toISOString().slice(0, 10) };
      list.push(user); saveUsers(list); setSession(user.id); adoptGuest(user.id);
      e.target.reset();
      welcome(user);
    } else {
      const user = list.find((u) => u.email === email);
      const passHash = await sha256(password);
      if (!user || user.passHash !== passHash) return toast("Email or password is incorrect");
      setSession(user.id); adoptGuest(user.id);
      e.target.reset();
      welcome(user);
    }
  }

  function onAvatar(e) {
    const file = e.target.files && e.target.files[0];
    const u = currentUser(); if (!u || !file) return;
    if (!file.type || file.type.indexOf("image/") !== 0) return toast("Choose an image file");
    if (file.size > 5 * 1024 * 1024) return toast("Image must be under 5 MB");
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function () {
      const c = document.createElement("canvas"); c.width = 256; c.height = 256;
      const ctx = c.getContext("2d");
      const s = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
      const data = c.toDataURL("image/jpeg", 0.86);
      const list = users().map((x) => x.id === u.id ? Object.assign({}, x, { avatar: data }) : x);
      saveUsers(list); URL.revokeObjectURL(url); toast("Photo updated"); render();
    };
    img.onerror = function () { toast("Could not read that image"); URL.revokeObjectURL(url); };
    img.src = url;
  }

  }

  document.addEventListener("click", (e) => {
    const a = e.target.closest("[data-go]");
    if (a) { e.preventDefault(); go(a.getAttribute("data-go")); return; }
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const act = b.getAttribute("data-act");
    const id = b.getAttribute("data-id");
    if (act === "mute") AudioEng.toggle();
    if (act === "menu") openDrawer("menu");
    if (act === "close") closeDrawer();
    if (act === "clearq") { state.q = ""; go(catalogueQuery()); }
    if (act === "fav") toggleFav(id);
    if (act === "add") addToEnq(id, state.view === "product" ? state.qty : (BY_ID[id] ? BY_ID[id].moq : 1));
    if (act === "applyf") {
      state.brand = $("#fbrand").value; state.model = $("#fmodel").value; state.type = $("#ftype").value;
      state.stock = $("#fstock").value; state.grade = $("#fgrade").value; state.minP = $("#fmin").value; state.maxP = $("#fmax").value;
      state.page = 1; go(catalogueQuery());
    }
    if (act === "resetf") {
      state.brand = state.model = state.type = state.stock = state.grade = state.minP = state.maxP = state.q = "";
      state.page = 1; go("#/catalogue");
    }
    if (act === "page") { state.page = parseInt(b.getAttribute("data-n"), 10); go(catalogueQuery()); }
    if (act === "qty") {
      const d = parseInt(b.getAttribute("data-d"), 10);
      state.qty = Math.max(1, state.qty + d);
      const inp = $("#pqty"); if (inp) inp.value = state.qty;
    }
    if (act === "eqty") {
      const d = parseInt(b.getAttribute("data-d"), 10);
      const list = enq().map((x) => x.id === id ? Object.assign({}, x, { qty: Math.max(1, x.qty + d) }) : x);
      saveEnq(list); render();
    }
    if (act === "erem") { saveEnq(enq().filter((x) => x.id !== id)); render(); }
    if (act === "submitenq") {
      const items = enq().map((r) => ({ id: r.id, qty: r.qty, sku: BY_ID[r.id] && BY_ID[r.id].sku, name: BY_ID[r.id] && BY_ID[r.id].name, price: BY_ID[r.id] && BY_ID[r.id].price })).filter((x) => x.sku);
      if (!items.length) return;
      if (!currentUser()) { toast("Sign in to submit"); go("login"); return; }
      const total = items.reduce((s, x) => s + x.price * x.qty, 0);
      const ticket = { id: "TE-ENQ-" + Date.now().toString(36).toUpperCase(), date: new Date().toLocaleString("en-IN"), items, total, status: "Recorded on this device" };
      const all = submitted(); all.unshift(ticket); saveSubmitted(all); saveEnq([]); AudioEng.add();
      toast("Enquiry "+ticket.id+" recorded"); render();
    }
    if (act === "printenq") {
      const items = enq().map((r) => { const p = BY_ID[r.id]; return p ? (r.qty + " × " + p.sku + " · " + p.name + " · " + fmt(p.price * r.qty)) : ""; }).filter(Boolean);
      const text = "Trusted Enterprises enquiry\nOwner: Shahnawaz Mirza\n\n" + items.join("\n");
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast("Enquiry copied")).catch(() => toast("Copy failed"));
      else toast("Copy not available");
    }
    if (act === "logout") { setSession(null); toast("Signed out"); go("home"); render(); }
    if (act === "delacc") {
      const u = currentUser(); if (!u) return;
      if (!confirm("Delete the local account on this browser? Favourites and enquiries for this account will go with it.")) return;
      saveUsers(users().filter((x) => x.id !== u.id));
      setSession(null);
      ["te_fav","te_enq","te_recent","te_sub"].forEach((k) => { try { localStorage.removeItem(k + "_" + u.id); } catch (err) {} });
      toast("Local account removed"); go("home"); render();
    }
  });

  $("#ov").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeDrawer();
    if (e.key === "/" && e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
      e.preventDefault(); const el = $("#q") || $("#qm"); if (el) el.focus();
    }
  });
  window.addEventListener("hashchange", render);

  function boot() {
    const bar = $("#bar"); const lp = $("#lpct");
    compileCatalogue();
    let pct = 0;
    const t = setInterval(() => {
      pct = Math.min(100, pct + 20);
      bar.style.width = pct + "%";
      lp.textContent = "Preparing catalogue " + pct + "%";
      if (pct >= 100) {
        clearInterval(t);
        $("#loader").classList.add("hide");
        $("#app").classList.add("ready");
        render();
      }
    }, 40);
  }

  boot();
})();
</script>
</body>
</html>
